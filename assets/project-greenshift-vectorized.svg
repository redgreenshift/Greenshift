<svg
  version="1.2"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 4000 800"
  width="500"
  height="100"
>
<defs>
  <linearGradient
    id="logo-gradient"
    gradientUnits="userSpaceOnUse"
    x1="220"
    y1="0"
    x2="3735"
    y2="0"
  >
    <!-- Dark left end -->
    <stop offset="0%"   stop-color="#003b0c"/>

    <!-- Gradually lighter toward the G -->
    <stop offset="32%"  stop-color="#008f22"/>
    <stop offset="42%"  stop-color="#16d83b"/>

    <!-- Brightest point: approximate center of the G -->
    <stop offset="47%"  stop-color="#45ff63"/>

    <!-- Gradually darker toward the right -->
    <stop offset="57%"  stop-color="#16d83b"/>
    <stop offset="70%"  stop-color="#008f22"/>
    <stop offset="100%" stop-color="#003b0c"/>
  </linearGradient>

<filter
  id="raised-glow"
  x="0"
  y="0"
  width="4000"
  height="800"
  filterUnits="userSpaceOnUse"
  color-interpolation-filters="sRGB"
>
	<!-- Soft green glow around the logo -->
  <feGaussianBlur
    in="SourceGraphic"
    stdDeviation="12"
    result="blur"
  />

  <feFlood
    flood-color="#00d936"
    flood-opacity="0.25"
    result="glow-color"
  />

  <feComposite
    in="glow-color"
    in2="blur"
    operator="in"
    result="outer-glow"
  />

  <!-- Blurred alpha edge used to create the rounded bevel -->
<!-- Deeper rounded bevel -->
<feGaussianBlur
  in="SourceAlpha"
  stdDeviation="4"
  result="soft-alpha"
/>

<!-- Bright upper-left bevel -->
<feSpecularLighting
  in="soft-alpha"
  surfaceScale="8"
  specularConstant="0.55"
  specularExponent="16"
  lighting-color="#79df83"
  result="highlight-light"
>
  <feDistantLight
    azimuth="225"
    elevation="50"
  />
</feSpecularLighting>

<feComposite
  in="highlight-light"
  in2="SourceAlpha"
  operator="in"
  result="highlight"
/>

<!-- Dark lower-right bevel -->
<feDiffuseLighting
  in="soft-alpha"
  surfaceScale="7"
  diffuseConstant="0.7"
  lighting-color="#002a08"
  result="shadow-light"
>
  <feDistantLight
    azimuth="45"
    elevation="30"
  />
</feDiffuseLighting>

<feComposite
  in="shadow-light"
  in2="SourceAlpha"
  operator="in"
  result="shadow"
/>

  <!-- Combine the effects with the original gradient artwork -->
  <feMerge>
    <feMergeNode in="outer-glow"/>
    <feMergeNode in="shadow"/>
    <feMergeNode in="SourceGraphic"/>
    <feMergeNode in="highlight"/>
  </feMerge>
</filter>	
</defs>

<style>
  .s0 {
    fill: url(#logo-gradient);
  }
</style>

<!-- Underline, painted first so descenders remain in front -->
<path
  d="M 220 590 H 3735"
  fill="none"
  stroke="url(#logo-gradient)"
  stroke-width="24"
  stroke-linecap="butt"
	filter="url(#raised-glow)"
/>


