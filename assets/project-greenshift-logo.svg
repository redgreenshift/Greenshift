<svg xmlns="http://www.w3.org/2000/svg"
     width="360"
     height="64"
     viewBox="0 0 360 64"
     role="img"
     aria-label="Project Greenshift">

  <defs>
    <!-- Dark → bright green → dark green across the entire logo -->
    <linearGradient id="logoGradient"
                    x1="0"
                    y1="0"
                    x2="360"
                    y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#006600"/>
      <stop offset="24%"  stop-color="#00aa00"/>
      <stop offset="44%"  stop-color="#00ff00"/>
      <stop offset="62%"  stop-color="#00dd00"/>
      <stop offset="82%"  stop-color="#009900"/>
      <stop offset="100%" stop-color="#006600"/>
    </linearGradient>
  </defs>

  <text x="180"
        y="43"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="38"
        font-weight="bold"
        letter-spacing="0"
        fill="url(#logoGradient)">
    Project Greenshift
  </text>
</svg>