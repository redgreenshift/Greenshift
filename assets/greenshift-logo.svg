<svg xmlns="http://www.w3.org/2000/svg"
     width="250"
     height="64"
     viewBox="0 0 250 64"
     role="img"
     aria-label="Greenshift">

  <defs>
    <!-- Bright green → dark green -->
    <linearGradient id="greenshiftGradient"
                    x1="0"
                    y1="0"
                    x2="250"
                    y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00ff00"/>
      <stop offset="15%"  stop-color="#00ee00"/>
      <stop offset="30%"  stop-color="#00dd00"/>
      <stop offset="45%"  stop-color="#00cc00"/>
      <stop offset="60%"  stop-color="#00aa00"/>
      <stop offset="75%"  stop-color="#009900"/>
      <stop offset="100%" stop-color="#006600"/>
    </linearGradient>
  </defs>

  <text x="125"
        y="43"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="url(#greenshiftGradient)">
    Greenshift
  </text>
</svg>
