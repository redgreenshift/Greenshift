<svg xmlns="http://www.w3.org/2000/svg"
     width="250"
     height="74"
     viewBox="0 8 250 74"
     role="img"
     aria-label="Greenshift">

  <defs>
    <linearGradient id="greenGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%"   stop-color="#00ff00"/>
      <stop offset="15%"  stop-color="#00ee00"/>
      <stop offset="30%"  stop-color="#00dd00"/>
      <stop offset="45%"  stop-color="#00cc00"/>
      <stop offset="60%"  stop-color="#00aa00"/>
      <stop offset="75%"  stop-color="#009900"/>
      <stop offset="88%"  stop-color="#007700"/>
      <stop offset="100%" stop-color="#006600"/>
    </linearGradient>

    <filter id="shadow">
      <feOffset dx="1.5" dy="2" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.95" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="6" y="64"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-style="italic"
        letter-spacing="-1.5"
        fill="#001900"
        stroke="#001900"
        stroke-width="5">
    Greenshift
  </text>

  <text x="6" y="62"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-style="italic"
        letter-spacing="-1.5"
        fill="url(#greenGradient)"
        stroke="#005500"
        stroke-width="1.2"
        paint-order="stroke fill"
        filter="url(#shadow)">
    Greenshift
  </text>

  <text x="6" y="61"
        text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-style="italic"
        letter-spacing="-1.5"
        fill="none"
        stroke="#00aa00"
        stroke-width="0.6"
        opacity="0.8"
        filter="url(#glow)">
    Greenshift
  </text>

  <!-- Left-aligned underline -->
<path d="M 8,76 C 68,75 165,75 238,75"
      fill="none"
      stroke="#003d00"
      stroke-width="5"/>

<path d="M 8,74 C 68,73 165,73 238,73"
      fill="none"
      stroke="url(#greenGradient)"
      stroke-width="2"
      filter="url(#glow)"/>
</svg>